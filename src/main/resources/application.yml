server:
  port: 8666

info:
  app:
    name: Exception Manager
    version: 1.0

spring:
  datasource:
    url: jdbc:postgresql://localhost:6432/rm
    username: appuser
    password: postgres
    driverClassName: org.postgresql.Driver
    hikari:
      maximumPoolSize: 50

  jpa:
    database-platform: org.hibernate.dialect.PostgreSQLDialect
    hibernate:
      ddl-auto: update
    properties:
      hibernate:
        default_schema: exceptionmanager
        jdbc:
          lob:
            non_contextual_creation: true

  sql:
    init:
      mode: always

  jackson:
    # Boot 4 migration: freeze the wire format at Jackson 2 behaviour so this
    # release changes no API contract. Jackson 3 defaults would re-order every
    # response alphabetically and serialise java.time as ISO-8601 strings
    # instead of epoch numbers. REMOVE in H2 2027 as its own announced change.
    use-jackson2-defaults: true

management:
  endpoints:
    access:
      default: none
  endpoint:
    health:
      access: READ_ONLY

peek:
  timeout: 30000 # milliseconds

general-config:
  number-of-retries-before-logging: 1

logging:
  profile: DEV
  level:
    root: INFO